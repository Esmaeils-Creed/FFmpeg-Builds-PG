name: Vmaf Quick Test (Qwen)
#Created with Qwen 3.8 max help (critics from claude, fixes from qwen)

on:
  push:
    paths:
      - 'scripts.d/45-vmaf.sh' # Only triggers when you edit the VMAF script
  workflow_dispatch: {}

concurrency:
  group: vmaf-test-${{ github.ref }}
  cancel-in-progress: true # Cancels overlapping runs to prevent cache conflicts

env:
  DOCKER_BUILDKIT: 1
  TARGET: linux64
  VARIANT: gpl
  ADDIN: "9.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Use BtbN's official cleanup script (includes docker system prune)
      - name: Free Disk Space
        run: ./util/free_disk_space.sh

      # Optional but recommended: Login to GHCR to avoid anonymous pull rate limits
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE FIX: Patch vars.sh to pull BtbN's base images
      - name: Patch vars.sh for QUICKBUILD
        run: |
          # vars.sh uses: REPO="${GITHUB_REPOSITORY:-btbn/ffmpeg-builds}"
          # Since GITHUB_REPOSITORY is always set to your fork in GHA,
          # we must patch this file so QUICKBUILD=1 pulls from BtbN's public GHCR.
          sed -i 's|REPO="${GITHUB_REPOSITORY:-btbn/ffmpeg-builds}"|REPO="btbn/ffmpeg-builds"|g' util/vars.sh

      # 1. RESTORE CACHE (Dynamic Key)
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: quicktest-${{ env.TARGET }}-${{ env.VARIANT }}-${{ env.ADDIN }}-${{ github.run_id }}
          restore-keys: |
            quicktest-${{ env.TARGET }}-${{ env.VARIANT }}-${{ env.ADDIN }}-

      # 2. BUILD
      - name: Build image + ffmpeg
        run: |
          # QUICKBUILD=1 skips building base images (saving ~15-20 mins) 
          # and pulls them from BtbN's public GHCR registry instead.
          QUICKBUILD=1 ./makeimage.sh $TARGET $VARIANT $ADDIN
          ./build.sh $TARGET $VARIANT $ADDIN

      # 3. SAVE CACHE (Always run)
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: quicktest-${{ env.TARGET }}-${{ env.VARIANT }}-${{ env.ADDIN }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-${{ env.TARGET }}-${{ env.VARIANT }}-${{ env.ADDIN }}-test
          path: artifacts/*
          if-no-files-found: ignore
