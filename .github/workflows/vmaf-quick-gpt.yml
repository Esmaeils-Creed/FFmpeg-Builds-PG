name: Vmaf Quick Test (GPT)
#Created with GPT 5.6 Luna help

on:
  push:
    paths:
      - 'scripts.d/45-vmaf.sh'
  workflow_dispatch:

concurrency:
  group: vmaf-test-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: linux64
  VARIANT: gpl-shared
  ADDIN: 9.0

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker build layers
      - name: Restore BuildKit cache
        uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-vmaf-${{ hashFiles('scripts.d/45-vmaf.sh') }}
          restore-keys: |
            buildx-vmaf-

      - name: Build image
        run: |
          ./makeimage.sh "$TARGET" "$VARIANT" "$ADDIN"

      - name: Build ffmpeg
        run: |
          ./build.sh "$TARGET" "$VARIANT" "$ADDIN"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-vmaf-cuda-test
          path: artifacts/*
