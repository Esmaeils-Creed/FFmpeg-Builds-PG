name: Test Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target'
        type: string
        default: 'linux64'
      variant:
        description: 'Variant, e.g. "gpl 9.0"'
        type: string
        default: 'gpl 9.0'
      release:
        description: 'Publish a test release on success'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

# all branches share the :latest image and :cache ref, so runs must not overlap
concurrency:
  group: test-build
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  BUILD_TARGET: ${{ inputs.target || 'linux64' }}
  BUILD_VARIANT: ${{ inputs.variant || 'gpl 9.0' }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${BUILD_TARGET}-${BUILD_VARIANT}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Download cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update downloads
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh $BUILD_TARGET $BUILD_VARIANT
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  ffmpeg:
    name: Build ffmpeg and release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh $BUILD_TARGET $BUILD_VARIANT
      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          set -e
          shopt -s nullglob
          BRANCH="$(echo "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"
          TAG="test-${BRANCH}-${GITHUB_RUN_NUMBER}"
          VMAF_PIN="$(grep -E '^SCRIPT_COMMIT=' scripts.d/45-vmaf.sh | head -1 | cut -d'"' -f2)"
          (cd artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          {
            echo "Test build from \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::7}\`"
            echo
            echo "- target/variant: \`$BUILD_TARGET $BUILD_VARIANT\`"
            echo "- libvmaf pin: \`$VMAF_PIN\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat artifacts/checksums.sha256
            echo '```'
          } > release_body.md
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Test: $GITHUB_REF_NAME #$GITHUB_RUN_NUMBER ($BUILD_TARGET $BUILD_VARIANT)" --notes-file release_body.md artifacts/*.{zip,tar.xz} artifacts/checksums.sha256
          gh release list --limit 200 --json tagName --jq "[.[] | select(.tagName | startswith(\"test-\"))] | .[${KEEP}:] | .[].tagName" | while read -r t; do gh release delete --cleanup-tag --yes "$t" || true; done
