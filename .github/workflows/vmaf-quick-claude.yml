name: Vmaf Quick Test (GLM)
#Created with sonnet 5 medium help

name: Quick vmaf test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: quicktest-linux64-gpl9.0-${{ github.run_id }}
          restore-keys: quicktest-linux64-gpl9.0-

      - name: Build image + ffmpeg
        run: |
          ./makeimage.sh linux64 gpl 9.0
          ./build.sh linux64 gpl 9.0

      # Explicit save, decoupled from the job's overall success/failure/cancel
      # state, so a run that gets cancelled or times out mid-compile still
      # persists whatever stages it finished — the automatic post-job save
      # this action normally does on its own is what silently ate your
      # previous run's progress.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: quicktest-linux64-gpl9.0-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ffmpeg-linux64-gpl9.0-test
          path: artifacts/*
          if-no-files-found: ignore
